name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FLIMKit and the bridge server
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps \
            'flimkit @ git+https://github.com/FLIMKit/FLIMKit.git@main'
          pip install 'flimkit-bridge @ git+https://github.com/FLIMKit/flimkit-bridge'

      - name: Install the test tools
        run: pip install pytest numpy

      - name: Run tests
        run: pytest -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test the Fiji plugin
        working-directory: plugin
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        with:
          name: fiji-plugin-jar
          path: plugin/target/*.jar
