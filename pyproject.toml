[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'flimkit-plugin-template'
version = '0.1.0'
description = 'A starting point for a FLIMKit add-on'
readme = 'README.md'
requires-python = '>=3.12'
license = 'MIT'
license-files = ['LICENSE.md']
authors = [
    {name = 'Your Name', email = 'you@example.org'},
]
keywords = ['FLIM', 'FLIMKit', 'plugin']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
]
dependencies = []

[project.optional-dependencies]
test = ['pytest']

[project.urls]
FLIMKit = 'https://github.com/FLIMKit/FLIMKit'

[project.entry-points.'flimkit.plugins']
plugin_template = 'flimkit_plugin_template'

[tool.setuptools.packages.find]
include = ['flimkit_plugin_template*']
